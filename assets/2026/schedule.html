  <style>
    :root {
      /* branding */
      --faff-pink: #ffaff3;
      --white: #fefefc;
      --unnamed-blue: #a6f0fc;
      --aged-plastic-yellow: #fffbe8;
      --unexpected-aubergine: #584355;
      --underwater-blue: #292d3e;
      --charcoal: #2f2f2f;
      --black: #1e1e1e;
      --blacker: #151515;

      /* non-standard */
      --burgandy: #6d5d6e
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: var(--gleam-dark);
      /* overflow: hidden;
      width: 100vw;
      height: 100vh; */
    }

    svg {
      height: 1920px
    }

    .star {
      --star-features: transparent;

      &.pink {
        --star-fill: var(--faff-pink);
        --star-border: var(--faff-pink);
      }

      &.yellow {
        --star-fill: var(--aged-plastic-yellow);
        --star-border: var(--aged-plastic-yellow);
      }

      &.white {
        --star-fill: var(--white);
        --star-border: var(--white);
      }
      &.face {
        --star-features: var(--blacker)
      }
    }
  </style>
</head>
